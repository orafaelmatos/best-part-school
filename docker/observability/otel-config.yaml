# Exemplo para otel/opentelemetry-collector-contrib:0.165.0.
# Configure os mounts e as variáveis conforme docs/observabilidade-easypanel.md.
extensions:
  file_storage:
    directory: /var/lib/otelcol

receivers:
  file_log/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    storage: file_storage
    operators:
      - type: container
        format: docker
        add_metadata_from_filepath: false

  host_metrics:
    root_path: /hostfs
    collection_interval: 60s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      filesystem:
        exclude_fs_types:
          fs_types: [proc, sysfs, tmpfs, devtmpfs, overlay, squashfs, cgroup, cgroup2]
          match_type: strict

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512
  resource/vps:
    attributes:
      - key: host.name
        value: ${env:OBS_HOST_NAME}
        action: upsert
      - key: deployment.environment.name
        value: production
        action: upsert

exporters:
  otlp_http/openobserve:
    endpoint: ${env:OPENOBSERVE_ENDPOINT}
    headers:
      Authorization: ${env:OPENOBSERVE_AUTH}
      stream-name: infraestrutura
    sending_queue:
      storage: file_storage
      queue_size: 128
      num_consumers: 2

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [file_log/docker]
      processors: [memory_limiter, resource/vps, batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [host_metrics]
      processors: [memory_limiter, resource/vps, batch]
      exporters: [otlp_http/openobserve]
