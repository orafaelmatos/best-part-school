name: CI

on:
  pull_request:
    branches: [main, feat/mobile-app]
  push:
    branches: [main, feat/mobile-app]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate workflow helper
        run: bash -n scripts/new-feature.sh
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npm run check:types
      - name: Test mobile development scripts
        run: npm run test:mobile-scripts
      - name: Test frontend
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Build student app
        run: npm run build:student
        env:
          VITE_API_URL: https://api.example.test/api/
          VITE_MEDIA_BASE_URL: https://api.example.test
          VITE_PUBLIC_SITE_URL: https://example.test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mobile-interface:
    name: Mobile interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bps_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bps_ci
      DJANGO_SECRET_KEY: ci-only-test-key-with-at-least-32-characters
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      OPENAI_API_KEY: ci-placeholder
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip --no-deps -r requirements.txt
      - run: python manage.py check
      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test backend
        run: python manage.py test accounts lessons marketplace payments practice ai_study bps_core --noinput
